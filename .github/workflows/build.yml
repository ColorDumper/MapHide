name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read-only; the release job below opts into write.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Import check
        run: python map_hider.py --selftest

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # needed only to create/update the Release on a tag build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PyInstaller output occasionally trips Defender on the hosted runner.
      - name: Exclude workspace from Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        continue-on-error: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A tagged build must match the version baked into the app: APP_VERSION
      # drives the runtime, version_info.txt drives the exe's file properties.
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $line = Select-String -Path maphide/paths.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          $appVersion = $line.Matches[0].Groups[1].Value
          Write-Host "tag=$tag  APP_VERSION=$appVersion"
          if ($tag -ne $appVersion) {
            Write-Error "Tag '$tag' does not match APP_VERSION '$appVersion' in maphide/paths.py. Bump the version strings before tagging."
            exit 1
          }

          $digits = $tag.TrimStart('v')
          $want4 = "$digits.0"
          $wantTuple = ($digits -replace '\.', ', ') + ', 0'
          $vi = Get-Content version_info.txt -Raw
          $required = @(
            "filevers=($wantTuple)"
            "prodvers=($wantTuple)"
            "StringStruct(`"FileVersion`", `"$want4`")"
            "StringStruct(`"ProductVersion`", `"$want4`")"
          )
          $missing = $required | Where-Object { -not $vi.Contains($_) }
          if ($missing) {
            Write-Error "version_info.txt is out of sync with tag '$tag'. Expected: $($missing -join '; '). Update version_info.txt before tagging."
            exit 1
          }
          Write-Host "version_info.txt matches $tag"

      - name: Build
        run: pyinstaller --noconfirm MapHide.spec

      - name: Smoke test the build
        shell: pwsh
        run: |
          $exe = 'dist/MapHide/MapHide.exe'
          if (-not (Test-Path $exe)) { throw 'MapHide.exe missing' }
          if (-not (Test-Path 'dist/MapHide/_internal/python*.dll')) { throw '_internal runtime missing' }
          if (-not (Test-Path 'dist/MapHide/_internal/assets/MapHide_Icon_64.png')) { throw 'bundled assets missing' }

          # Import the whole module graph from the frozen exe. A missing hidden
          # import exits non-zero here instead of crashing on a user's machine;
          # the windowed build has no stdout, so the exit code is the signal.
          # (Start-Process, not the call operator, so a windowed exe is waited on.)
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "MapHide.exe --selftest exited $($p.ExitCode)" }

          # Real run: headless against a dead endpoint. It must start its worker,
          # fail the connection cleanly, and exit on its own without hanging.
          $cfg = @{
            host = '127.0.0.1'; port = 4455; password = ''
            scene_item_name = 'Overlay'; auto_connect = $false
            hotkey = 'G'; toggle_mode = $false; hide_hotkey = 'H'
            hide_delay_ms = 120
          } | ConvertTo-Json
          $cfgDir = Join-Path $env:APPDATA 'MapHide'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          Set-Content -Path (Join-Path $cfgDir 'config.json') -Value $cfg -Encoding utf8

          $p = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'MapHide.exe --headless did not exit within 30s' }
          if ($p.ExitCode -ne 0) { throw "MapHide.exe --headless exited $($p.ExitCode)" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'
          } else {
            $version = 'dev-' + (git rev-parse --short HEAD)
          }
          $stage = "dist/MapHide-$version"
          Copy-Item -Recurse dist/MapHide $stage
          $zip = "dist/MapHide-$version-win64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip"         >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MapHide-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ github.ref_name }}'
          $zip  = '${{ steps.package.outputs.zip }}'
          $repo = '${{ github.repository }}'

          # Boilerplate every release needs, below a rule so the notes written
          # for the release itself can go straight in above it. GitHub already
          # shows the asset's SHA-256 next to the download, so it is not repeated.
          $notes = @(
            "---"
            ""
            "Windows may show a ""Windows protected your PC"" message because this build isn't code-signed. Click **More info**, then **Run anyway**."
            ""
            "See the [changelog](https://github.com/$repo/blob/main/CHANGELOG.md) for full history."
          ) -join "`n"
          $notes | Out-File -FilePath notes.md -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists - uploading asset with --clobber"
            gh release upload $tag $zip --clobber
          } else {
            Write-Host "Creating draft release $tag"
            gh release create $tag $zip --draft --title $tag --notes-file notes.md
          }
