name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read-only; the release job below opts into write.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The same Python the project uses everywhere; see .python-version.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # Every package is pinned with checksums; a download that doesn't
        # match them fails the install.
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Window check
        run: python map_hider.py --selftest

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # needed only to create/update the Release on a tag build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PyInstaller output occasionally trips Defender on the hosted runner.
      - name: Exclude workspace from Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        continue-on-error: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The same Python the project uses everywhere; see .python-version.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # Every package is pinned with checksums; a download that doesn't
        # match them fails the install.
        run: pip install --require-hashes -r requirements-dev.txt

      # A tagged build must match the version in maphide/version.py, the one
      # place it is written; the exe's file properties are generated from it.
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $appVersion = python -c "from maphide.version import APP_VERSION; print(APP_VERSION)"
          Write-Host "tag=$tag  APP_VERSION=$appVersion"
          if ($tag -ne $appVersion) {
            Write-Error "Tag '$tag' does not match VERSION in maphide/version.py ('$appVersion'). Set it before tagging."
            exit 1
          }

      - name: Build
        run: pyinstaller --noconfirm MapHide.spec

      - name: Smoke test the build
        shell: pwsh
        run: |
          $exe = 'dist/MapHide/MapHide.exe'
          if (-not (Test-Path $exe)) { throw 'MapHide.exe missing' }
          if (-not (Test-Path 'dist/MapHide/_internal/python*.dll')) { throw '_internal runtime missing' }
          if (-not (Test-Path 'dist/MapHide/_internal/assets/MapHide_Icon_64.png')) { throw 'bundled assets missing' }

          # The exe's file properties are generated from maphide/version.py.
          $want = (python -c "from maphide.version import version_parts; print('.'.join(map(str, version_parts())))")
          $have = (Get-Item $exe).VersionInfo.FileVersion
          if ($have -ne $want) { throw "MapHide.exe file version is '$have', expected '$want'" }
          $channel = (Get-Content 'dist/MapHide/_internal/channel.txt' -Raw).Trim()
          if ($channel -ne 'github') { throw "Build channel is '$channel', expected 'github'" }

          # Import the whole module graph from the frozen exe and build the
          # window without showing it. A missing hidden import, or a piece of
          # Qt the spec trimmed that the window needs, exits non-zero here
          # instead of failing on a user's machine; the windowed build has no
          # stdout, so the exit code is the signal.
          # (Start-Process, not the call operator, so a windowed exe is waited on.)
          # A crash at startup shows an error dialog that would wait forever,
          # so give up after a minute.
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            throw 'MapHide.exe --selftest did not finish within a minute (likely a startup error dialog)'
          }
          if ($p.ExitCode -ne 0) { throw "MapHide.exe --selftest exited $($p.ExitCode)" }

          # Real run: headless against a dead endpoint. An unreachable OBS is
          # retried forever by design - MapHide is a persistent background
          # service and never gives up on its own just because OBS isn't up
          # yet - so this checks the process survives its first failed
          # attempt instead of crashing, then stops it the way a user would.
          $cfg = @{
            host = '127.0.0.1'; port = 4455; password = ''
            scene_item_name = 'Overlay'; auto_connect = $false
            hotkey = 'G'; toggle_mode = $false; hide_hotkey = 'H'
            hide_delay_ms = 120
          } | ConvertTo-Json
          $cfgDir = Join-Path $env:APPDATA 'MapHide'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          Set-Content -Path (Join-Path $cfgDir 'config.json') -Value $cfg -Encoding utf8

          $p = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "MapHide.exe --headless exited early with code $($p.ExitCode)" }
          $p.Kill()
          $p.WaitForExit()

      - name: Package
        id: package
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'
          } else {
            $version = 'dev-' + (git rev-parse --short HEAD)
          }
          $stage = "dist/MapHide-$version"
          Copy-Item -Recurse dist/MapHide $stage
          $zip = "dist/MapHide-$version-win64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip"         >> $env:GITHUB_OUTPUT

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          # One known version builds every installer, whatever the runner
          # image happens to come with.
          $innoVersion = '6.7.1'
          $innoDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $iscc = "$innoDir\ISCC.exe"
          function Get-InnoVersion {
            $uninstaller = "$innoDir\unins000.exe"
            if (Test-Path $uninstaller) { (Get-Item $uninstaller).VersionInfo.ProductVersion.Trim() } else { '' }
          }
          if ((Get-InnoVersion) -ne $innoVersion) {
            choco install innosetup --version $innoVersion --allow-downgrade --force --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $found = Get-InnoVersion
          if ($found -ne $innoVersion) { throw "Inno Setup is $found, expected $innoVersion" }
          $appVersion = python -c "from maphide.version import VERSION; print(VERSION)"
          $name = 'MapHide-${{ steps.package.outputs.version }}-setup'
          & $iscc /Qp installer/MapHide.iss "/DAppVersion=$appVersion" "/DOutputName=$name"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "setup=dist/$name.exe" >> $env:GITHUB_OUTPUT

      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = '${{ steps.installer.outputs.setup }}'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\MapHide'
          $p = Start-Process $setup '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup exited $($p.ExitCode)" }
          if (-not (Test-Path "$app\MapHide.exe")) { throw 'MapHide.exe not installed' }
          $p = Start-Process "$app\MapHide.exe" '--selftest' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Installed MapHide.exe --selftest timed out' }
          if ($p.ExitCode -ne 0) { throw "Installed MapHide.exe --selftest exited $($p.ExitCode)" }
          $p = Start-Process "$app\unins000.exe" '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstall exited $($p.ExitCode)" }
          # The uninstaller removes its own copy a moment after it exits.
          Start-Sleep -Seconds 3
          if (Test-Path "$app\MapHide.exe") { throw 'Uninstall left MapHide.exe behind' }

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MapHide-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.installer.outputs.setup }}
          if-no-files-found: error

      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ github.ref_name }}'
          $zip  = '${{ steps.package.outputs.zip }}'
          $setup = '${{ steps.installer.outputs.setup }}'
          $repo = '${{ github.repository }}'

          # Boilerplate every release needs, below a rule so the notes written
          # for the release itself can go straight in above it. GitHub already
          # shows the asset's SHA-256 next to the download, so it is not repeated.
          $notes = @(
            "---"
            ""
            "Windows may show a ""Windows protected your PC"" message because this build isn't code-signed. Click **More info**, then **Run anyway**."
            ""
            "See the [changelog](https://github.com/$repo/blob/main/CHANGELOG.md) for full history."
          ) -join "`n"
          $notes | Out-File -FilePath notes.md -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists - uploading asset with --clobber"
            gh release upload $tag $setup $zip --clobber
          } else {
            Write-Host "Creating draft release $tag"
            gh release create $tag $setup $zip --draft --title $tag --notes-file notes.md
          }
